<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-box">
    <input id="in-1" type="number" placeholder="Eenter your value 1">
    <input id="in-2" type="number" placeholder="Eenter your value 2">
    <div class="results-box" id="result" placeholder="0"></div>
   
   <div class="buttons">
   <button id="addbtn">+</button>
   <button id="subbtn">-</button>
   <button id="mulbtn">*</button>
   <button id="divbtn">/</button>
     <button id="resetbtn">Reset</button>
   </div>
  
</div>
<script>
    let input1 = document.querySelector("#in-1");
      let input2 = document.querySelector("#in-2");
        let result = document.querySelector("#result");
        
    let addbtn = document.querySelector("#addbtn");
let subbtn = document.querySelector("#subbtn");
let mulbtn = document.querySelector("#mulbtn");
let divbtn = document.querySelector("#divbtn");
 let resetbtn = document.querySelector("#resetbtn");
 function add(){
    let a = Number(input1.value);
    let b = Number(input2.value);
     result.innerText = a + b;
     console.log(a+b);
 }

  function sub(){
    let a = Number(input1.value);
    let b = Number(input2.value);
     result.innerText = a - b;
     console.log(a-b);
 }
 
  function mul(){
    let a = Number(input1.value);
    let b = Number(input2.value);
     result.innerText = a * b;
     console.log(a*b);
 }
 
  function div(){
    let a = Number(input1.value);
    let b = Number(input2.value);
     result.innerText = a / b;
     console.log(a/b);
 }
 function reset(){
  input1.value="";
  input2.value="";
  result.innerText="";
 }
 addbtn.addEventListener("click",add);
 subbtn.addEventListener("click",sub);
 
 mulbtn.addEventListener("click",mul);
 
 divbtn.addEventListener("click",div);
 resetbtn.addEventListener("click",reset);
</script>
</body>
    

</html>
